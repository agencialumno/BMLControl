name: Build e Testes iOS (BML Control)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Compilar IPA e Rodar Testes Unitários
    runs-on: macos-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Selecionar versão estável do Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Gerar projeto Xcode a partir do project.yml
        run: xcodegen generate

      - name: Executar Testes Unitários do Protocolo
        run: |
          SIM_ID=$(xcrun simctl list devices available | grep -m 1 "iPhone" | sed -E 's/.*\(([0-9A-F-]+)\).*/\1/')
          echo "Simulador selecionado: $SIM_ID"
          xcodebuild test \
            -project BMLControl.xcodeproj \
            -scheme BMLControl \
            -destination "id=$SIM_ID" \
            CODE_SIGNING_ALLOWED=NO

      - name: Compilar Release Archive (ARM64 Sem Assinatura)
        run: |
          xcodebuild archive \
            -project BMLControl.xcodeproj \
            -scheme BMLControl \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/BMLControl.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empacotar IPA para Sideload no Windows
        run: |
          mkdir -p build/Payload
          cp -r build/BMLControl.xcarchive/Products/Applications/BMLControl.app build/Payload/
          cd build
          zip -r BMLControl-unsigned.ipa Payload

      - name: Publicar Artefato BMLControl-unsigned.ipa
        uses: actions/upload-artifact@v4
        with:
          name: BMLControl-unsigned-ipa
          path: build/BMLControl-unsigned.ipa
          retention-days: 14